name: Static site validation

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "evidence/**"
      - "frontend/public/fonts/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "evidence/**"
      - "frontend/public/fonts/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: "10.15.1"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Type and content check
        working-directory: site
        run: pnpm check

      - name: Build static documentation
        working-directory: site
        env:
          SITE_URL: https://arena.ss-data.cc
          SITE_BASE: /
        run: pnpm build

      - name: Verify generated pages and links
        working-directory: site
        env:
          SITE_BASE: /
        run: pnpm verify:build

